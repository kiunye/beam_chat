<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none" aria-hidden="true">
  <!-- Shield outline -->
  <path
    d="M100 10 C60 10, 25 30, 25 65 L25 140 C25 175, 55 205, 100 220 C145 205, 175 175, 175 140 L175 65 C175 30, 140 10, 100 10Z"
    stroke="#006948"
    stroke-width="12"
    fill="none"
    stroke-linejoin="round"
  />
  <!-- Tree canopy -->
  <ellipse cx="100" cy="115" rx="42" ry="38" fill="#0f172a"/>
  <!-- Tree trunk -->
  <rect x="94" y="145" width="12" height="30" rx="3" fill="#0f172a"/>
  <!-- Signal rays emanating from shield top -->
  <line x1="100" y1="10" x2="100" y2="-15" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="10" x2="72" y2="-10" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="10" x2="128" y2="-10" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <!-- BeamChat text -->
  <text x="100" y="208" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#0f172a" letter-spacing="-0.5">BeamChat</text>
</svg>
