# Docker Swarm deployment stack for BEAM Chat (production).
#
# Usage:
#   docker stack deploy --env-file .env -c docker-compose.swarm.yml beam_chat
#
# Required environment variables (inject at deploy time via
# `--env-file .env` / exported CI variables — `docker stack deploy` does NOT
# auto-read a `.env` file; no literal values are allowed in this file):
#   DATABASE_URL, SECRET_KEY_BASE, PHX_HOST, RELEASE_COOKIE, SSO_JWT_SECRET,
#   LIVEKIT_HOST, LIVEKIT_API_KEY, LIVEKIT_API_SECRET, LIVEKIT_URL,
#   MPESA_CONSUMER_KEY, MPESA_CONSUMER_SECRET, PAYSTACK_SECRET_KEY,
#   DB_USER, DB_PASSWORD, ACME_EMAIL, CI_PROJECT_PATH, IMAGE_TAG
#
# Deployment (CI, see .gitlab-ci.yml): the pipeline scp's this file and
# livekit_config.yaml to ~/beam_chat/ on the swarm host, then runs
#   docker stack deploy --env-file .env --compose-file docker-compose.swarm.yml \
#     --with-registry-auth beam_chat_staging   # or beam_chat_prod
# The .env file (containing all secrets above) must be pre-provisioned on
# the host as ~/beam_chat/.env. Shell-exported variables (IMAGE_TAG,
# PHX_HOST, CI_PROJECT_PATH) take precedence over .env for interpolation.
#
# Swarm node labels that MUST be set on the manager nodes before deploy:
#   - livekit node:  node.labels.livekit == true
#   - postgres node: node.labels.db == true
#   (e.g. docker node update --label-add livekit=true <node-id>)
#
# TLS topology — Traefik terminates TLS; the app and LiveKit signaling both
# get Let's Encrypt certificates via the ACME HTTP-01 challenge on port 80:
#   app:   https://${PHX_HOST}        → Traefik :443  → app:4000
#   video: wss://${LIVEKIT_HOST}      → Traefik :7880 → livekit:7880 (plaintext)
#   media: ICE/UDP (7882/udp) + RTC TCP (7881/tcp) published host-mode on the
#          livekit node — direct media path, NOT via Traefik.
# ACME uses HTTP-01 instead of TLS-ALPN-01: TLS-ALPN-01 can only be
# validated on port 443, but LiveKit signaling terminates at Traefik on
# :7880. With HTTP-01, certs for both domains are validated via port 80.
# DNS for ${PHX_HOST} and ${LIVEKIT_HOST} must point at the swarm managers,
# and port 80 must be reachable from the internet for challenge validation.
#
# Design notes:
#   - No Redis service: Oban persists jobs in Postgres (plan drops Redis).
#   - The per-container Erlang node name is derived at boot by
#     rel/env.sh.eex (RELEASE_NODE="beam_chat@${HOSTNAME}") — replicas must
#     not share a fixed RELEASE_NODE, so none is passed here.
#   - LiveKit's UDP media port is published with mode: host (§11.2 mitigation
#     for Swarm's unreliable UDP routing mesh).
#   - Traefik routing labels live under deploy.labels because in Swarm mode
#     Traefik reads labels from the service, not the task containers.

networks:
  beam_net:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  traefik_certs:

configs:
  livekit_config:
    file: ./livekit_config.yaml

services:
  traefik:
    image: traefik:v3.1 # TODO(deploy): pin to a specific v3.1.x patch once the current version is confirmed, matching the livekit pin stance
    command:
      - "--providers.swarm=true"
      - "--providers.swarm.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.livekit-tcp.address=:7880"
      # HTTP-01 challenge on the web entrypoint (port 80). TLS-ALPN-01 is
      # NOT usable here: it is always validated on port 443, but LiveKit
      # signaling TLS terminates on :7880. Traefik serves the HTTP-01
      # challenge before the web→websecure redirect (official docs:
      # "Redirection is fully compatible with the HTTP-01 challenge").
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "7880:7880"   # LiveKit signaling (wss) — routed by the TCP router below
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - beam_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  app:
    image: registry.gitlab.com/${CI_PROJECT_PATH}:${IMAGE_TAG}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST}
      RELEASE_COOKIE: ${RELEASE_COOKIE}
      # Required by config/runtime.exs (raises without it). Optional rotation
      # list SSO_JWT_SECRETS is read but not required — unset is fine.
      SSO_JWT_SECRET: ${SSO_JWT_SECRET}
      # The per-container Erlang node name is derived at boot by
      # rel/env.sh.eex (RELEASE_NODE="beam_chat@${HOSTNAME}") — a fixed
      # RELEASE_NODE here would collide across the 3 replicas.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Public WSS URL for clients — clients must hit the Traefik TCP
      # entrypoint port: e.g. wss://${LIVEKIT_HOST}:7880 (:443 has no TCP
      # router for the LiveKit host).
      LIVEKIT_URL: ${LIVEKIT_URL}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - beam_net
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.app.rule=Host(`${PHX_HOST}`)"
        - "traefik.http.routers.app.entrypoints=websecure"
        - "traefik.http.routers.app.tls.certresolver=le"
        - "traefik.http.services.app.loadbalancer.server.port=4000"
        - "traefik.http.services.app.loadbalancer.sticky.cookie=true"
        - "traefik.http.services.app.loadbalancer.sticky.cookie.name=beam_chat_lb"
        - "traefik.http.services.app.loadbalancer.sticky.cookie.secure=true"

  livekit:
    image: livekit/livekit-server:v1.13.5   # pinned — current stable (2026-07-31); do not float :latest
    command: --config /etc/livekit/config.yaml
    environment:
      # Compose interpolates ${LIVEKIT_API_KEY} / ${LIVEKIT_API_SECRET} from
      # the deploy-time env; the container receives "<key>: <secret>" which is
      # LiveKit's LIVEKIT_KEYS format. Keys are never baked into
      # livekit_config.yaml.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    configs:
      - source: livekit_config
        target: /etc/livekit/config.yaml
    ports:
      # Signaling (7880/tcp) is NOT published here anymore — Traefik fronts it
      # via the TCP router below (wss://${LIVEKIT_HOST} → Traefik :7880 →
      # livekit:7880 plaintext). Media stays direct:
      - target: 7881
        published: 7881
        protocol: tcp
      - target: 7882
        published: 7882
        protocol: udp
        mode: host   # ICE/UDP media — host mode bypasses Swarm's UDP routing mesh (§11.2)
    networks:
      - beam_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.livekit == true
      labels:
        # TCP router terminating TLS for LiveKit signaling. HostSNI matches
        # the SNI from the client's wss://${LIVEKIT_HOST} connection; the
        # certificate comes from the le resolver (HTTP-01).
        - "traefik.enable=true"
        - "traefik.tcp.routers.livekit.rule=HostSNI(`${LIVEKIT_HOST}`)"
        - "traefik.tcp.routers.livekit.entrypoints=livekit-tcp"
        - "traefik.tcp.routers.livekit.tls.certresolver=le"
        - "traefik.tcp.services.livekit.loadbalancer.server.port=7880"
      # The swarm manager running Traefik must open 7880/tcp (signaling);
      # the node carrying the livekit label must open 7881/tcp and 7882/udp
      # (media). rtc.use_external_ip: true (see livekit_config.yaml) requires
      # that node's public IP / NAT forwarding — LiveKit detects its external
      # IP via STUN at startup.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beam_chat_prod
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - beam_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.db == true
