# Local development services (matches PRD Postgres 16 baseline + LiveKit dev server).
# Run from this directory: docker compose up -d
# Then: mix setup
#
# LiveKit runs with its `--dev` defaults (api_key=devkey, api_secret=secret),
# which are mirrored in .env.example so the server can issue tokens.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beam_chat_dev
    ports:
      - "5432:5432"
    volumes:
      - beam_chat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beam_chat_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.13.5   # pinned to match docker-compose.swarm.yml (current stable, 2026-07-31)
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"   # HTTP/WS signaling
      - "7881:7881"   # ICE/TCP
      - "7882:7882/udp"  # ICE/UDP (media)
    environment:
      LIVEKIT_KEYS: "devkey: secret"

volumes:
  beam_chat_pgdata:
